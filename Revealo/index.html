<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revealo | Luxe Digitale Krasuitnodigingen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b0c10 0%, #1a1c23 50%, #0d0e12 100%);
            --accent-champagne: #cbb281;
            --text-main: #1c1d21;
            --text-sub: #5e626e;
            --font-title: 'Cinzel', serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --wax-bg: radial-gradient(circle at 35% 35%, #e8d5b5 0%, #cbb281 60%, #8a7246 100%);
            --envelope-bg: linear-gradient(180deg, #f7f5f0 0%, #eae5dc 100%);
            --card-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 243, 239, 0.95) 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg-gradient);
            font-family: var(--font-body);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* ---------------- LANDINGSPAGINA STYLES ---------------- */
        #landingView {
            display: none;
            width: 100%;
            min-height: 100vh;
            color: #ffffff;
            padding-bottom: 60px;
        }

        .landing-header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .landing-logo { width: 130px; height: auto; }

        .btn-login {
            background: transparent;
            border: 1px solid var(--accent-champagne);
            color: var(--accent-champagne);
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-login:hover { background: var(--accent-champagne); color: #0b0c10; }

        .hero {
            max-width: 900px;
            margin: 50px auto 70px;
            padding: 0 20px;
            text-align: center;
        }

        .hero h1 { font-family: var(--font-title); font-size: 2.6rem; line-height: 1.25; margin-bottom: 20px; }
        .hero h1 span { color: var(--accent-champagne); }
        .hero p { font-size: 1.05rem; color: #a0a5b5; max-width: 620px; margin: 0 auto 36px; font-weight: 300; }

        .btn-cta {
            display: inline-block;
            background: linear-gradient(135deg, #e8d5b5 0%, #cbb281 100%);
            color: #0b0c10;
            padding: 16px 36px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(203, 178, 129, 0.3);
            transition: transform 0.2s ease;
        }

        .btn-cta:hover { transform: translateY(-2px); }

        .features-grid {
            max-width: 1000px;
            margin: 0 auto 80px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 28px 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .feature-card .icon { font-size: 2rem; margin-bottom: 12px; display: block; }
        .feature-card h3 { font-family: var(--font-title); color: var(--accent-champagne); font-size: 1.1rem; margin-bottom: 8px; }
        .feature-card p { font-size: 0.85rem; color: #a0a5b5; }

        /* ---------------- UITNODIGING VIEW STYLES ---------------- */
        #invitationView {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
        }

        .scene-box {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 420px;
            max-height: 840px;
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(190%);
            -webkit-backdrop-filter: blur(40px) saturate(190%);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            overflow-x: hidden;
            perspective: 1000px;
            transition: background 0.5s ease;
        }

        @media (min-width: 420px) {
            .app-container {
                border-radius: 36px;
                height: 780px;
                border: 1px solid rgba(255, 255, 255, 0.5);
            }
        }

        /* ENVELOP EN GSAP LAAG */
        .envelope-graphic {
            position: absolute;
            inset: 0;
            z-index: 30;
            background: var(--envelope-bg);
        }
